# esbuild ships its native binary in a platform-specific optional package
# (@esbuild/win32-x64, @esbuild/linux-x64, @esbuild/darwin-*), so its
# postinstall check is not required. Skipping install scripts also keeps
# `pnpm install` usable in restricted environments where a child process
# cannot use piped stdio. strictDepBuilds=false keeps ignored builds from
# failing the install.
ignoreScripts: true
strictDepBuilds: false
